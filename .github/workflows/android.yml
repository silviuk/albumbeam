name: Android checks
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/publish-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build both apps, test and lint
        run: ./gradlew assembleDebug test lintPhoneDebug lintTvDebug assembleAndroidTest --no-daemon
      - name: Save APKs for signing
        uses: actions/upload-artifact@v7.0.2
        with:
          name: albumbeam-apks
          path: |
            app/build/outputs/apk/phone/debug/app-phone-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk
          retention-days: 3
          if-no-files-found: error
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check helper source and generated userscript
        run: |
          node --version
          node --check edge-helper/core.js
          node --check edge-helper/content.js
          node --test edge-helper/tests/core.test.cjs
          python3 edge-helper/build.py
          git diff --exit-code -- edge-helper/photosbeam-helper.user.js
      - name: Exercise desktop and touch grids
        run: |
          npm install --no-save --ignore-scripts playwright@1.65.0
          npx playwright install --with-deps chromium
          node edge-helper/tests/browser.cjs
  camera-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install compile platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real MediaStore, thumbnails, original bytes and paged HTTP
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: ./gradlew connectedPhoneDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.personal.photostv.CameraFeedTest --no-daemon
      - name: Save camera device test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: camera-device-reports
          path: app/build/reports/androidTests
          retention-days: 3
